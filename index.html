<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野球カウンター</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #121212; color: white; padding: 20px; }
        .box { background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 20px; max-width: 400px; margin: 20px auto; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #333; color: white; border: 1px solid #555; border-radius: 6px; font-size: 16px; }
        .btn { width: 100%; padding: 14px; font-size: 18px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; margin-top: 8px; }
        .btn-green { background: #4caf50; }
        .btn-blue { background: #1e90ff; }
        .btn-yellow { background: #ffd700; color: black; }
        .btn-red { background: #ff4500; }
        #main-app { display: none; }
        .bso-board { font-size: 32px; font-family: monospace; text-align: left; width: 140px; margin: 20px auto; line-height: 1.6; font-weight: bold; letter-spacing: 4px; }
        .b-color { color: #1e90ff; } .s-color { color: #ffd700; } .o-color { color: #ff4500; }
    </style>
</head>
<body>

    <div id="login-page" class="box">
        <h2>チームログイン</h2>
        <input type="text" id="team" value="タイガース">
        <input type="password" id="pass" value="tiger123">
        <button class="btn btn-green" onclick="login()">ログイン認証</button>
    </div>

    <div id="main-app" class="box">
        <h3>野球スコア速報</h3>
        
        <div class="bso-board">
            B: <span id="b-disp" class="b-color">○○○</span><br>
            S: <span id="s-disp" class="s-color">○○</span><br>
            O: <span id="o-disp" class="o-color">○○</span>
        </div>
        
        <p style="font-size: 18px;">状況: <span id="status">試合中</span></p>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn btn-blue" onclick="addCount('B')">ボール</button>
            <button class="btn btn-yellow" onclick="addCount('S')">ストライク</button>
            <button class="btn btn-green" style="grid-column: span 2;" onclick="addCount('H')">ヒット (安打)</button>
            <button class="btn btn-red" style="grid-column: span 2;" onclick="addCount('O')">凡打 (アウト)</button>
        </div>
    </div>

    <script>
        // 試合の状態データ
        let B = 0; let S = 0; let O = 0; let text = "試合中";

        // ログインボタンの処理（絶対に壊れないシンプル設計）
        function login() {
            const teamInput = document.getElementById("team").value;
            const passInput = document.getElementById("pass");
            
            // パスワードが「tiger123」なら画面を切り替える
            if (passInput.value === "tiger123") {
                document.getElementById("login-page").style.display = "none";
                document.getElementById("main-app").style.display = "block";
                refresh();
            } else {
                alert("パスワードが違います。");
            }
        }

        // カウントボタン（B/S/H/O）を押した時の処理
        function addCount(type) {
            if (type === 'B') {
                B++; text = "ボール";
                if (B === 4) { B = 0; S = 0; text = "フォアボール"; }
            } else if (type === 'S') {
                S++; text = "ストライク";
                if (S === 3) { B = 0; S = 0; O++; text = "三振アウト"; }
            } else if (type === 'H') {
                B = 0; S = 0; text = "ヒット！";
            } else if (type === 'O') {
                B = 0; S = 0; O++; text = "アウト";
            }

            if (O >= 3) {
                alert("3アウトチェンジ！");
                B = 0; S = 0; O = 0; text = "チェンジ";
            }
            refresh();
        }

        // 画面のランプ（○）を力ずくで書き換える関数
        function refresh() {
            document.getElementById("b-disp").innerText = "●".repeat(B) + "○".repeat(3 - B);
            document.getElementById("s-disp").innerText = "●".repeat(S) + "○".repeat(2 - S);
            document.getElementById("o-disp").innerText = "●".repeat(O) + "○".repeat(2 - O);
            document.getElementById("status").innerText = text;
        }
    </script>
</body>
</html>
