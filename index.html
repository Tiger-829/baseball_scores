<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>総合野球スコア管理＆速報システム</title>
    <style>
        /* 全体・ダークモードデザイン */
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; background-color: #121212; color: #e0e0e0; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; padding: 6px; }
        .box { background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 12px; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        /* ログイン画面 */
        #login-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-box { width: 90%; max-width: 360px; background: #1e1e1e; border: 1px solid #444; border-radius: 12px; padding: 25px; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 4px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; font-size: 15px; background: #2d2d2d; color: white; border: 1px solid #555; border-radius: 6px; }
        
        #mode-page { display: none; padding-top: 50px; }
        #main-app { display: none; }
        h1 { font-size: 18px; color: #4caf50; margin: 6px 0; }
        
        /* スコアボード */
        .score-table { width: 100%; border-collapse: collapse; background: #141916; font-family: monospace; font-size: 16px; margin-bottom: 5px; }
        .score-table th, .score-table td { border: 1px solid #333; padding: 5px; text-align: center; }
        .score-table th { background: #222; font-size: 11px; color: #aaa; }
        .team-name-cell { text-align: left !important; font-weight: bold; width: 75px; font-size: 12px; color: #fff; }
        .score-cell-clickable { cursor: pointer; background: #1c2621; transition: background 0.2s; }
        .score-cell-clickable:hover { background: #2e7d32; }
        
        /* 対戦情報 */
        .match-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 13px; background: #252525; padding: 6px; border-radius: 6px; margin-bottom: 8px; }
        .match-info-item { text-align: left; }
        .match-info-label { color: #888; font-size: 10px; display: block; }
        .match-info-value { font-weight: bold; font-size: 13px; color: #fff; }
        
        /* BSO ＆ ダイヤモンド */
        .live-status-layout { display: flex; align-items: center; justify-content: space-around; background: #151515; padding: 8px; border-radius: 8px; }
        .count-indicator { font-family: monospace; font-size: 20px; text-align: left; font-weight: bold; line-height: 1.4; }
        .yellow { color: #ffd700; text-shadow: 0 0 5px #ffd700; } 
        .blue { color: #1e90ff; text-shadow: 0 0 5px #1e90ff; } 
        .red { color: #ff4500; text-shadow: 0 0 5px #ff4500; }
        
        .scorebook-cell { width: 90px; height: 90px; border: 2px solid #444; position: relative; background: #1a1a1a; border-radius: 6px; }
        .diamond-line { position: absolute; width: 46px; height: 46px; border: 1px solid #333; top: 20px; left: 20px; transform: rotate(45deg); }
        .base { position: absolute; width: 14px; height: 14px; background: #444; border: 1px solid #222; transform: rotate(45deg); transition: background 0.2s, transform 0.2s; }
        .b1 { right: 10px; top: 36px; } .b2 { left: 36px; top: 10px; } .b3 { left: 10px; top: 36px; }
        .cell-text { position: absolute; bottom: 34px; width: 100%; text-align: center; font-size: 11px; font-weight: bold; color: #fff; pointer-events: none; }
        .active-base { background: #4caf50 !important; border-color: #fff; transform: rotate(45deg) scale(1.1); }

        /* 操作パネルのレイアウト */
        #input-controls { display: none; }
        .grid-buttons { display: flex; flex-direction: column; gap: 6px; margin-top: 5px; }
        
        .pitch-btn-container { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
        .hit-btn-container { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 4px; }
        .special-btn-container { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .complex-btn-container { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #141414; padding: 4px; border-radius: 6px; border: 1px solid #333; }
        .util-btn-container { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        
        .btn { padding: 11px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; -webkit-tap-highlight-color: transparent; }
        .btn-b { background: #1e90ff; } .btn-s { background: #ffd700; color: black; } .btn-f { background: #4caf50; } 
        
        .btn-hit { font-size: 11px; padding: 9px 2px; font-weight: bold; border-radius: 5px; border: none; color: white; cursor: pointer; }
        .btn-h1 { background: #2e7d32; } .btn-h2 { background: #1b5e20; } .btn-h3 { background: #004d40; } .btn-h4 { background: #b71c1c; }
        
        .btn-spec { font-size: 11px; padding: 7px 2px; background: #0288d1; font-weight: bold; border-radius: 5px; border: none; color: white; cursor: pointer; }
        .btn-cpx { font-size: 11px; padding: 7px 2px; background: #e65100; font-weight: bold; border-radius: 5px; border: none; color: white; cursor: pointer; }
        
        .btn-o { background: #ff4500; padding: 10px; font-size: 13px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; }
        .btn-change { background: #9c27b0; padding: 8px; font-size: 12px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; }
        .btn-util { background: #555; font-size: 12px; padding: 7px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; }
        
        .modal-mask { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; }
        .modal-content-scroller { max-height: 85vh; overflow-y: auto; background: #252525; padding: 15px; border-radius: 10px; width: 95%; max-width: 420px; border: 1px solid #444; }
        
        .log-container { text-align: left; background: #000; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 11px; max-height: 100px; overflow-y: auto; color: #a0ff00; border: 1px solid #222; }
        .log-item { border-bottom: 1px solid #111; padding: 3px 0; line-height: 1.3; }

        .lineup-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 5px; }
        .lineup-box { background: #141414; border: 1px solid #2a2a2a; border-radius: 6px; padding: 6px; text-align: left; font-size: 11px; }
        .lineup-title { font-weight: bold; color: #4caf50; border-bottom: 1px solid #333; padding-bottom: 2px; margin-bottom: 4px; font-size: 12px; }
        .player-row { display: flex; justify-content: space-between; padding: 1px 0; border-bottom: 1px solid #1a1a1a; }
        .current-batter-active { background: #2e3d36; color: #4caf50; font-weight: bold; }
        .order-form-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 4px; margin-bottom: 8px; text-align: left; }
    </style>
</head>
<body>

    <!-- 1. ログイン画面 -->
    <div id="login-page">
        <div class="login-box">
            <h2 style="margin-top:0; color:#4caf50; font-size:20px;">TEAM LOGIN</h2>
            <div class="input-group">
                <label>団体名（チーム名）</label>
                <input type="text" id="login-team" value="タイガース">
            </div>
            <div class="input-group">
                <label>パスワード</label>
                <input type="password" id="login-pass" value="tiger123">
            </div>
            <button class="btn btn-h1" style="width:100%; margin-top:10px; background:#2e7d32;" onclick="handleLogin()">ログイン認証</button>
        </div>
    </div>

    <!-- 2. モード選択画面 -->
    <div id="mode-page" class="container">
        <div class="box" style="margin-top:40px;">
            <h2>ログイン成功</h2>
            <p>システムを起動します</p>
            <button class="btn btn-b" style="width:100%; height: 60px;" onclick="startApp()">スコア管理システムを起動する</button>
        </div>
    </div>

    <!-- 3. 本番アプリケーション速報画面 -->
    <div id="main-app" class="container">
        <h1>ベースボールスコア管理システム</h1>

        <!-- 試合選択メニュー -->
        <div class="box" id="match-select-box" style="padding:8px; background:#1a2421; border-color:#2e7d32;">
            <div class="input-group" style="margin-bottom:0;">
                <label style="color:#4caf50; font-size:11px;">👁 管理中の試合を切り替え</label>
                <select id="app-match-selector" style="padding:6px; font-size:13px;" onchange="onMatchSelectionChange()">
                    <!-- 動的に展開されます -->
                </select>
            </div>
        </div>

        <!-- ランニングスコアボード -->
        <div class="box" style="padding: 4px;">
            <table class="score-table">
                <thead>
                    <tr><th>チーム</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>R</th></tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="team-name-cell" id="board-v-name">先攻チーム</td>
                        <td id="r-v1" class="score-cell-clickable" onclick="editManualScore('v',1)">-</td>
                        <td id="r-v2" class="score-cell-clickable" onclick="editManualScore('v',2)">-</td>
                        <td id="r-v3" class="score-cell-clickable" onclick="editManualScore('v',3)">-</td>
                        <td id="r-v4" class="score-cell-clickable" onclick="editManualScore('v',4)">-</td>
                        <td id="r-v5" class="score-cell-clickable" onclick="editManualScore('v',5)">-</td>
                        <td id="r-v6" class="score-cell-clickable" onclick="editManualScore('v',6)">-</td>
                        <td id="r-v7" class="score-cell-clickable" onclick="editManualScore('v',7)">-</td>
                        <td id="r-v8" class="score-cell-clickable" onclick="editManualScore('v',8)">-</td>
                        <td id="r-v9" class="score-cell-clickable" onclick="editManualScore('v',9)">-</td>
                        <td id="r-v-total" style="font-weight:bold; color:#ffd700;">0</td>
                    </tr>
                    <tr>
                        <td class="team-name-cell" id="board-h-name">後攻チーム</td>
                        <td id="r-h1" class="score-cell-clickable" onclick="editManualScore('h',1)">-</td>
                        <td id="r-h2" class="score-cell-clickable" onclick="editManualScore('h',2)">-</td>
                        <td id="r-h3" class="score-cell-clickable" onclick="editManualScore('h',3)">-</td>
                        <td id="r-h4" class="score-cell-clickable" onclick="editManualScore('h',4)">-</td>
                        <td id="r-h5" class="score-cell-clickable" onclick="editManualScore('h',5)">-</td>
                        <td id="r-h6" class="score-cell-clickable" onclick="editManualScore('h',6)">-</td>
                        <td id="r-h7" class="score-cell-clickable" onclick="editManualScore('h',7)">-</td>
                        <td id="r-h8" class="score-cell-clickable" onclick="editManualScore('h',8)">-</td>
                        <td id="r-h9" class="score-cell-clickable" onclick="editManualScore('h',9)">-</td>
                        <td id="r-h-total" style="font-weight:bold; color:#ffd700;">0</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 対戦インフォメーション -->
        <div class="match-info-grid">
            <div class="match-info-item"><span class="match-info-label">投手（守備球数）</span><span class="match-info-value" id="info-pitcher">-- (0球)</span></div>
            <div class="match-info-item"><span class="match-info-label">現在の下席（打順）</span><span class="match-info-value" id="info-batter">-- (1番)</span></div>
        </div>

        <!-- BSO ＆ ダイヤモンド -->
        <div class="box" style="padding:6px;">
            <div class="live-status-layout">
                <div class="count-indicator">
                    B: <span id="b-dots" class="blue">○○○</span><br>
                    S: <span id="s-dots" class="yellow">○○</span><br>
                    O: <span id="o-dots" class="red">○○</span>
                </div>
                <div class="scorebook-cell">
                    <div class="diamond-line"></div>
                    <div id="base2" class="base b2"></div>
                    <div id="base3" class="base b3"></div>
                    <div id="base1" class="base b1"></div>
                    <div class="cell-text" id="cell-result">試合中</div>
                </div>
            </div>
        </div>

        <!-- 入力操作パネル -->
        <div id="input-controls" class="box">
            <h3 style="margin-top:0; color:#ffd700; font-size:14px;">【操作パネル】</h3>
            
            <div style="display:flex; gap:4px; margin-bottom:8px;">
                <button class="btn btn-h1" style="flex:1; font-size:11px; padding:6px; background:#2e7d32;" onclick="openNewMatchModal()">➕ 新規試合・オーダー手動登録</button>
                <button class="btn btn-red" style="flex:1; font-size:11px; padding:6px; background:#b71c1c;" onclick="toggleMatchStatus()">🔒 この試合を【更新終了】にする</button>
            </div>

            <div class="grid-buttons">
                <!-- ①：投球基本カウントボタンコンテナ -->
                <div class="pitch-btn-container">
                    <button class="btn btn-b" onclick="pitch('B')">ボール (B)</button>
                    <button class="btn btn-s" onclick="pitch('S')">ストライク (S)</button>
                    <button class="btn btn-f" onclick="pitch('F')">ファウル (F)</button>
                </div>
                
                <!-- ②：安打（ヒット）系ボタンコンテナ -->
                <div class="hit-btn-container">
                    <button class="btn-hit btn-h1" onclick="openDetailsModal('安打', 1)">単打</button>
                    <button class="btn-hit btn-h2" onclick="openDetailsModal('安打', 2)">二塁打</button>
                    <button class="btn-hit btn-h3" onclick="openDetailsModal('安打', 3)">三塁打</button>
                    <button class="btn-hit btn-h4" onclick="openDetailsModal('安打', 4)">本塁打</button>
                </div>

                <!-- ③：ストライク/ボールを伴うWP・PB複合（振り逃げ対応）コンテナ -->
                <div class="complex-btn-container">
                    <button class="btn-cpx" onclick="pitchComplex('S_WP')">ストライク+WP<br><span style="font-size:9px;">(空振振り逃げ等)</span></button>
                    <button class="btn-cpx" onclick="pitchComplex('S_PB')">ストライク+PB<br><span style="font-size:9px;">(後逸振り逃げ等)</span></button>
                    <button class="btn-cpx" style="background:#0d47a1;" onclick="pitchComplex('B_WP')">ボール+WP<br><span style="font-size:9px;">(暴投進塁)</span></button>
                    <button class="btn-cpx" style="background:#0d47a1;" onclick="pitchComplex('B_PB')">ボール+PB<br><span style="font-size:9px;">(後逸進塁)</span></button>
                </div>

                <!-- ④：盗塁・単発特殊ボタンコンテナ -->
                <div class="special-btn-container">
                    <button class="btn-spec" onclick="executeSpecialPlay('盗塁成功')">🏃 盗塁成功</button>
                    <button class="btn-spec" style="background:#b71c1c;" onclick="executeSpecialPlay('盗塁死')">🛑 盗塁/走塁死</button>
                    <button class="btn-spec" style="background:#e65100;" onclick="openDetailsModal('犠飛', 0)">📐 犠牲フライ</button>
                    <button class="btn-spec" style="background:#ad1457;" onclick="executeSpecialPlay('ボーク')">⚡ ボーク</button>
                </div>
                
                <!-- ⑤：凡打アウト・選手交代・微調整・Undo・リセット群 -->
                <button class="btn-o" onclick="openDetailsModal('凡打', 0)">凡打・アウト詳細入力</button>
                <button class="btn-change" onclick="openChangeModal()">🔄 選手交代・走者配置微調整</button>
                
                <div class="util-btn-container">
                    <button class="btn-util" onclick="onUndoClick()">1手戻す(Undo)</button>
                    <button class="btn-util" style="background:#424242;" onclick="resetAtBatCountBtn()">カウントリセット</button>
                </div>
            </div>
        </div>

        <!-- 詳細タイムラインログ -->
        <div class="box">
            <h3>【詳細試合記録タイムライン（スコアブック清書用）】</h3>
            <div id="log-list" class="log-container">打席記録はまだありません。</div>
        </div>

        <!-- オーダー表 -->
        <div class="lineup-layout">
            <div class="lineup-box"><div class="lineup-title" id="v-team-label">先攻・打線</div><div id="v-lineup-list"></div></div>
            <div class="lineup-box"><div class="lineup-title" id="h-team-label">後攻・打線</div><div id="h-lineup-list"></div></div>
        </div>
    </div>

    <!-- 新規試合＆手動オーダー登録モーダル -->
    <div id="new-match-modal" class="modal-mask">
        <div class="modal-content-scroller">
            <h3 style="margin-top:0; color:#4caf50; font-size:16px;">新規試合 ＆ オーダー手動登録</h3>
            <div class="input-group"><label>試合識別名（管理一覧用）</label><input type="text" id="form-match-id" value="20260604_第一試合"></div>
            <div class="input-group"><label>先攻チーム名</label><input type="text" id="form-v-team-name" value="タイガース" onchange="updateFormLabels()"></div>
            <div class="input-group"><label>後攻チーム名</label><input type="text" id="form-h-team-name" value="ライオンズ" onchange="updateFormLabels()"></div>
            <h4 style="color:#ffd700; margin:15px 0 5px 0; border-bottom:1px solid #555; text-align:left; font-size:13px;" id="form-v-label-title">先攻オーダー手動入力</h4><div id="form-v-players-inputs"></div>
            <h4 style="color:#ffd700; margin:15px 0 5px 0; border-bottom:1px solid #555; text-align:left; font-size:13px;" id="form-h-label-title">後攻オーダー手動入力</h4><div id="form-h-players-inputs"></div>
            <div class="grid-buttons" style="margin-top:15px;"><button class="btn btn-h1" style="background:#2e7d32;" onclick="commitNewMatch()">このオーダーで試合を作成</button><button class="btn btn-util" onclick="closeNewMatchModal()">キャンセル</button></div>
        </div>
    </div>

    <!-- 打撃・凡打・特殊アウト詳細入力ポップアップモーダル -->
    <div id="details-modal" class="modal-mask">
        <div class="modal-content-scroller" style="background:#252525;">
            <h3 id="modal-details-title" style="margin-top:0; color:#4caf50; font-size:15px;">打撃詳細記録</h3>
            <div class="input-group">
                <label>打球が飛んだ場所/守備位置</label>
                <select id="detail-direction">
                    <option value="ピッチャー(1)">投手 (1)</option><option value="キャッチャー(2)">捕手 (2)</option>
                    <option value="ファースト(3)">一塁 (3)</option><option value="セカンド(4)">二塁 (4)</option>
                    <option value="サード(5)">三塁 (5)</option><option value="ショート(6)">遊撃 (6)</option>
                    <option value="レフト(7)">左翼 (7)</option><option value="センター(8)">中翼 (8)</option>
                    <option value="ライト(9)">右翼 (9)</option>
                </select>
            </div>
            <div class="input-group">
                <label>打球の種類・性質</label>
                <select id="detail-type"><option value="ゴロ">ゴロ</option><option value="フライ">フライ</option><option value="ライナー">ライナー</option><option value="バント">バント</option></select>
            </div>
            <div class="input-group" id="out-detail-group" style="display:none;">
                <label>アウトの形（封殺・フォース状態詳細）</label>
                <select id="detail-out-kind">
                    <option value="通常アウト">バッターのみアウト（フライ・通常ゴロ）</option><option value="二塁封殺">一塁走者が二塁で封殺</option>
                    <option value="三塁封殺">走者が三塁で封殺</option><option value="本塁封殺">走者が本塁で封殺</option>
                    <option value="ダブルプレー">ゲッツー（併殺打）</option>
                </select>
            </div>
            <div class="grid-buttons"><button class="btn btn-h1" style="background:#2e7d32;" onclick="commitDetails()">詳細データを確定して反映</button><button class="btn btn-util" onclick="closeDetailsModal()">キャンセル</button></div>
        </div>
    </div>

    <!-- 選手交代・走者微調整メニュー -->
    <div id="change-modal" class="modal-mask">
        <div class="login-box" style="background:#252525;">
            <h3 style="margin-top:0; color:#9c27b0; font-size:15px;">選手交代・走者配置微調整</h3>
            <div class="input-group">
                <label>操作の種類</label>
                <select id="change-role" onchange="toggleChangeFields()"><option value="pitcher">投手交代</option><option value="batter">代打</option><option value="runner_on">ランナーを配置する</option><option value="runner_off">ランナーを消す</option></select>
            </div>
            <div class="input-group" id="change-target-group" style="display:none;"><label id="change-target-label">対象の塁</label><select id="change-target"></select></div>
            <div class="input-group" id="change-name-group"><label>選手名</label><input type="text" id="change-name"></div>
            <div class="grid-buttons"><button class="btn btn-h1" style="background:#9c27b0;" onclick="executeChange()">反映する</button><button class="btn btn-util" onclick="closeChangeModal()">閉じる</button></div>
        </div>
    </div>

    <script>
        const authDatabase = { "タイガース": "tiger123", "ジャイアンツ": "giant456" };

        let appDb = {
            currentActiveMatchId: "default_match",
            matches: {
                "default_match": {
                    matchId: "default_match", status: "進行中", vTeam: "先攻チーム", hTeam: "後攻チーム",
                    inning: 1, isTop: true, balls: 0, strikes: 0, outs: 0, 
                    vPitcherName: "先攻投手", vPitcherPitches: 0, 
                    hPitcherName: "後攻投手", hPitcherPitches: 0, 
                    vCurrentBatterIdx: 0, hCurrentBatterIdx: 0,
                    vScore: [0, null, null, null, null, null, null, null, null], 
                    hScore: [null, null, null, null, null, null, null, null, null],
                    vLineup: ["1番スタメン", "2番スタメン", "3番スタメン", "4番スタメン", "5番スタメン", "6番スタメン", "7番スタメン", "8番スタメン", "9番スタメン"],
                    hLineup: ["1番スタメン", "2番スタメン", "3番スタメン", "4番スタメン", "5番スタメン", "6番スタメン", "7番スタメン", "8番スタメン", "9番打者"],
                    bases: [false, false, false], lastEvent: "試合開始", history: []
                }
            }
        };

        let undoStack = []; let currentMode = "input"; let tempHitType = ""; let tempBasesCount = 0;

        function handleLogin() {
            const t = document.getElementById("login-team").value.trim();
            const p = document.getElementById("login-pass").value.trim();
            if (authDatabase[t] === p) {
                document.getElementById("login-page").style.display = "none";
                document.getElementById("mode-page").style.display = "block";
            } else { alert("団体名またはパスワードが違います。"); }
        }

        function startApp() {
            document.getElementById("mode-page").style.display = "none"; 
            document.getElementById("main-app").style.display = "block";
            document.getElementById("input-controls").style.display = "block";
            buildOrderFormInputs();
            renderUI();
        }

        function getActiveMatch() { 
            return appDb.matches[appDb.currentActiveMatchId]; 
        }
        
        function saveState() { undoStack.push(JSON.stringify(appDb)); }
        
        function onUndoClick() {
            if (undoStack.length > 0) { appDb = JSON.parse(undoStack.pop()); renderUI(); }
            else { alert("これ以上戻せません。"); }
        }

        // 基本投球カウント処理
        function pitch(type) {
            saveState(); 
            let id = appDb.currentActiveMatchId;
            let m = appDb.matches[id];
            
            if (m.isTop) { m.hPitcherPitches++; } else { m.vPitcherPitches++; }
            
            if (type === 'B') {
                m.balls++; m.lastEvent = "ボール";
                if (m.balls === 4) {
                    m.lastEvent = "四球";
                    m.history.push({ inning: m.inning, isTop: m.isTop, batter: getCurrentBatterNameDirect(), res: "四球", dir: "投手(1)", type: "判定", outKind: "四球出塁" });
                    advanceBasesDirect(1, false); 
                    m.balls = 0; m.strikes = 0;
                    nextBatterDirect(); 
                }
            } else if (type === 'S') {
                m.strikes++; m.lastEvent = "ストライク";
                if (m.strikes === 3) {
                    m.lastEvent = "三振アウト";
                    m.history.push({ inning: m.inning, isTop: m.isTop, batter: getCurrentBatterNameDirect(), res: "三振", dir: "捕手(2)", type: "判定", outKind: "三振アウト" });
                    m.outs++; 
                    m.balls = 0; m.strikes = 0;
                    nextBatterDirect(); 
                    checkInningChangeDirect();
                }
            } else if (type === 'F') {
                m.lastEvent = "ファウル"; 
                if (m.strikes < 2) { m.strikes++; }
            }
            renderUI(); 
        }

        // 複合プレイ（ストライク/ボール + 後逸落球）
        function pitchComplex(complexType) {
            saveState();
            let id = appDb.currentActiveMatchId;
            let m = appDb.matches[id];
            
            if (m.isTop) { m.hPitcherPitches++; } else { m.vPitcherPitches++; }
            
            if (complexType === 'S_WP' || complexType === 'S_PB') {
                m.strikes++;
                let playLabel = complexType === 'S_WP' ? "ワイルドピッチ(WP)" : "パスボール(PB)";
                m.lastEvent = "ストライク + " + playLabel;
                
                if (m.strikes === 3) {
                    m.lastEvent = "空振り三振 + 振り逃げ成立(" + (complexType === 'S_WP' ? "WP" : "PB") + ")";
                    m.history.push({ 
                        inning: m.inning, isTop: m.isTop, batter: getCurrentBatterNameDirect(), 
                        res: "三振", dir: "捕手(2)", type: playLabel, outKind: "振り逃げ一塁出塁" 
                    });
                    advanceBasesDirect(1, false); 
                    m.balls = 0; m.strikes = 0;
                    nextBatterDirect(); 
                } else {
                    advanceBasesDirect(1, false);
                }
            } 
            else if (complexType === 'B_WP' || complexType === 'B_PB') {
                m.balls++;
                let playLabel = complexType === 'B_WP' ? "ワイルドピッチ(WP)" : "パスボール(PB)";
                m.lastEvent = "ボール + " + playLabel;
                
                if (m.balls === 4) {
                    m.lastEvent = "四球 + " + playLabel;
                    m.history.push({ inning: m.inning, isTop: m.isTop, batter: getCurrentBatterNameDirect(), res: "四球", dir: "投手", type: playLabel, outKind: "四球安全進塁" });
                    advanceBasesDirect(1, false);
                    m.balls = 0; m.strikes = 0;
                    nextBatterDirect();
                } else {
                    advanceBasesDirect(1, false);
                }
            }
            renderUI();
        }

        function executeSpecialPlay(playType) {
            saveState();
            let id = appDb.currentActiveMatchId;
            let m = appDb.matches[id];
            
            if (playType === '盗塁成功') {
                m.lastEvent = "盗塁成功";
                let runners = [...m.bases];
                m.bases = [false, false, false];
                if (runners[2]) { addRunDirect(); } 
                if (runners[1]) m.bases[2] = true;
                if (runners[0]) m.bases[1] = true;
                m.history.push({ inning: m.inning, isTop: m.isTop, batter: "チーム走者", res: "盗塁成功", dir: "自由進塁", type: "足", outKind: "安全進塁" });
            } 
            else if (playType === '盗塁死') {
                m.lastEvent = "盗塁失敗/走塁死";
                m.outs++;
                if (m.bases[2]) m.bases[2] = false;
                else if (m.bases[1]) m.bases[1] = false;
                else if (m.bases[0]) m.bases[0] = false;
                m.history.push({ inning: m.inning, isTop: m.isTop, batter: "チーム走者", res: "盗塁死", dir: "塁上", type: "タッチアウト", outKind: "走塁アウト" });
                checkInningChangeDirect();
            } 
            else if (playType === 'ボーク') {
                m.lastEvent = "ボーク";
                let runners = [...m.bases];
                m.bases = [false, false, false];
                if (runners[2]) { addRunDirect(); }
                if (runners[1]) m.bases[2] = true;
                if (runners[0]) m.bases[1] = true;
                m.history.push({ inning: m.inning, isTop: m.isTop, batter: getCurrentBatterNameDirect(), res: "ボーク", dir: "投手", type: "反則", outKind: "安全進塁" });
            }
            renderUI();
        }

        function openDetailsModal(resultCategory, basesCount) {
            tempHitType = resultCategory; tempBasesCount = basesCount;  
            document.getElementById("details-modal").style.display = "flex";
            document.getElementById("modal-details-title").innerText = resultCategory + " の詳細を選択";
            document.getElementById("out-detail-group").style.display = (resultCategory === '凡打') ? "block" : "none";
        }
        function closeDetailsModal() { document.getElementById("details-modal").style.display = "none"; }

        function commitDetails() {
            saveState(); 
            let id = appDb.currentActiveMatchId;
            let m = appDb.matches[id];
            
            // ★【球数バグ完全消滅】：バットを振ってインプレイ（ゴロ、フライ、ライナー等）になったため、マウンドに立つ守備側投手の球数を【ここで確実に1加算】する
            if (m.isTop) { m.hPitcherPitches++; } else { m.vPitcherPitches++; }
            
            const dir = document.getElementById("detail-direction").value;
            const bType = document.getElementById("detail-type").value;
            const outKind = document.getElementById("detail-out-kind").value;
            const currentBatter = getCurrentBatterNameDirect();
            let displayResultText = "";

            if (tempHitType === '安打') {
                let txt = ["", "単打", "二塁打", "三塁打", "本塁打"];
                displayResultText = `${dir}への${bType}${txt[tempBasesCount]}`;
                advanceBasesDirect(tempBasesCount, true); 
            } else if (tempHitType === '犠飛') {
                displayResultText = `${dir}への${bType}犠牲フライ`;
                m.outs++;
            } else {
                displayResultText = `${dir}${bType}アウト`;
                if (outKind === "通常アウト") { m.outs++; } 
                else if (outKind === "二塁封殺") { m.outs++; m.bases[0] = false; displayResultText += " (二塁封殺)"; } 
                else if (outKind === "三塁封殺") { m.outs++; m.bases[1] = false; } 
                else if (outKind === "本塁封殺") { m.outs++; m.bases[2] = false; } 
                else if (outKind === "ダブルプレー") { m.outs += 2; m.bases[0] = false; displayResultText += " (併殺打)"; }
            }

            m.lastEvent = displayResultText;
            m.history.push({ 
                inning: m.inning, isTop: m.isTop, batter: currentBatter, 
                res: tempHitType, dir: dir, type: bType, outKind: tempHitType === '安打' ? "安全進塁" : "アウト判定" 
            });

            m.balls = 0; m.strikes = 0;
            nextBatterDirect(); 

            closeDetailsModal(); 
            checkInningChangeDirect();
            renderUI();
        }

        function advanceBasesDirect(count, isHit) {
            let id = appDb.currentActiveMatchId;
            let currentRunners = [...appDb.matches[id].bases]; 
            appDb.matches[id].bases = [false, false, false];
            
            for (let i = 2; i >= 0; i--) {
                if (currentRunners[i]) {
                    let newPos = i + count;
                    if (newPos >= 3) { addRunDirect(); } else { appDb.matches[id].bases[newPos] = true; }
                }
            }
            if (isHit) { 
                if (count === 4) { addRunDirect(); } else { appDb.matches[id].bases[count - 1] = true; } 
            } else {
                if (!currentRunners[0]) { appDb.matches[id].bases[0] = true; appDb.matches[id].bases[1] = currentRunners[1]; appDb.matches[id].bases[2] = currentRunners[2]; }
                else if (!currentRunners[1]) { appDb.matches[id].bases[0] = true; appDb.matches[id].bases[1] = true; appDb.matches[id].bases[2] = currentRunners[2]; }
                else if (!currentRunners[2]) { appDb.matches[id].bases[0] = true; appDb.matches[id].bases[1] = true; appDb.matches[id].bases[2] = true; addRunDirect(); }
                else { appDb.matches[id].bases[0] = true; appDb.matches[id].bases[1] = true; appDb.matches[id].bases[2] = true; addRunDirect(); }
            }
        }

        function addRunDirect() {
            let id = appDb.currentActiveMatchId;
            let idx = appDb.matches[id].inning - 1;
            if (appDb.matches[id].isTop) { 
                appDb.matches[id].vScore[idx] = (appDb.matches[id].vScore[idx] || 0) + 1; 
            } else { 
                appDb.matches[id].hScore[idx] = (appDb.matches[id].hScore[idx] || 0) + 1; 
            }
        }

        function editManualScore(teamType, inningNum) {
            saveState();
            let id = appDb.currentActiveMatchId;
            let m = appDb.matches[id];
            let currentVal = teamType === 'v' ? m.vScore[inningNum-1] : m.hScore[inningNum-1];
            let inputVal = prompt(`${inningNum}回${teamType==='v'?'表':'裏'}の得点を入力してください:`, currentVal === null ? 0 : currentVal);
            if (inputVal !== null) {
                let parsed = parseInt(inputVal);
                if (isNaN(parsed)) {
                    if (teamType === 'v') m.vScore[inningNum-1] = null; else m.hScore[inningNum-1] = null;
                } else {
                    if (teamType === 'v') m.vScore[inningNum-1] = parsed; else m.hScore[inningNum-1] = parsed;
                }
                renderUI();
            }
        }

        function getCurrentBatterNameDirect() { 
            let id = appDb.currentActiveMatchId;
            let m = appDb.matches[id];
            if (m.isTop) {
                return m.vLineup[m.vCurrentBatterIdx] || `${m.vCurrentBatterIdx + 1}番打者`;
            } else {
                return m.hLineup[m.hCurrentBatterIdx] || `${m.hCurrentBatterIdx + 1}番打者`;
            }
        }

        function nextBatterDirect() { 
            let id = appDb.currentActiveMatchId;
            let m = appDb.matches[id];
            if (m.isTop) {
                m.vCurrentBatterIdx = (m.vCurrentBatterIdx + 1) % 9; 
            } else {
                m.hCurrentBatterIdx = (m.hCurrentBatterIdx + 1) % 9; 
            }
            renderUI();
        }

        function resetAtBatCountBtn() {
            let id = appDb.currentActiveMatchId;
            appDb.matches[id].balls = 0; appDb.matches[id].strikes = 0;
            renderUI();
        }

        function checkInningChangeDirect() {
            let id = appDb.currentActiveMatchId;
            let m = appDb.matches[id];
            if (m.outs >= 3) {
                alert("3アウトチェンジ！攻守を交代します。");
                m.outs = 0; m.bases = [false, false, false]; m.balls = 0; m.strikes = 0;
                
                if (m.isTop) { 
                    m.isTop = false; 
                    m.hScore[m.inning - 1] = 0; 
                } else { 
                    m.isTop = true; 
                    m.inning++; 
                    if (m.inning <= 9) { 
                        m.vScore[m.inning - 1] = 0; 
                    } 
                }
                renderUI();
            }
        }

        function buildOrderFormInputs() {
            let vHtml = ""; let hHtml = "";
            for (let i = 0; i < 9; i++) {
                vHtml += `<div class="order-form-grid"><label>${i+1}番打者</label><input type="text" id="input-v-p${i}" value="${i+1}番スタメン"></div>`;
                hHtml += `<div class="order-form-grid"><label>${i+1}番打者</label><input type="text" id="input-h-p${i}" value="${i+1}番スタメン"></div>`;
            }
            document.getElementById("form-v-players-inputs").innerHTML = vHtml; document.getElementById("form-h-players-inputs").innerHTML = hHtml;
        }

        function updateFormLabels() {
            const vName = document.getElementById("form-v-team-name").value; const hName = document.getElementById("form-h-team-name").value;
            document.getElementById("form-v-label-title").innerText = `先攻【${vName}】オーダー手動入力`; document.getElementById("form-h-label-title").innerText = `後攻【${hName}】オーダー手動入力`;
        }

        function openNewMatchModal() { document.getElementById("new-match-modal").style.display = "flex"; updateFormLabels(); }
        function closeNewMatchModal() { document.getElementById("new-match-modal").style.display = "none"; }

        function commitNewMatch() {
            saveState();
            const matchId = document.getElementById("form-match-id").value.trim() || "無題の試合";
            const vTeam = document.getElementById("form-v-team-name").value.trim(); 
            const hTeam = document.getElementById("form-h-team-name").value.trim();
            
            let vLineup = []; let hLineup = [];
            for(let i=0; i<9; i++) {
                vLineup.push(document.getElementById(`input-v-p${i}`).value.trim()); 
                hLineup.push(document.getElementById(`input-h-p${i}`).value.trim());
            }
            
            appDb.matches[matchId] = {
                matchId: matchId, status: "進行中", vTeam: vTeam, hTeam: hTeam,
                inning: 1, isTop: true, balls: 0, strikes: 0, outs: 0, 
                vPitcherName: "先攻投手", vPitcherPitches: 0, 
                hPitcherName: "後攻投手", hPitcherPitches: 0, 
                vCurrentBatterIdx: 0, hCurrentBatterIdx: 0,
                vScore: [0, null, null, null, null, null, null, null, null], 
                hScore: [null, null, null, null, null, null, null, null, null],
                vLineup: vLineup, hLineup: hLineup, bases: [false, false, false], lastEvent: "プレーボール", history: []
            };
            appDb.currentActiveMatchId = matchId; 
            
            closeNewMatchModal(); 
            renderUI();
            alert(`試合 [${matchId}] を作成しました。スコアボードの未来マスを初期化しました。`);
        }

        function toggleMatchStatus() {
            saveState(); let id = appDb.currentActiveMatchId;
            if (appDb.matches[id].status === "進行中") { appDb.matches[id].status = "更新終了"; } else { appDb.matches[id].status = "進行中"; }
            renderUI();
        }

        function onMatchSelectionChange() {
            const selectedId = document.getElementById("app-match-selector").value;
            if (selectedId && appDb.matches[selectedId]) { appDb.currentActiveMatchId = selectedId; renderUI(); }
        }

        function openChangeModal() { document.getElementById("change-modal").style.display = "flex"; toggleChangeFields(); }
        function closeChangeModal() { document.getElementById("change-modal").style.display = "none"; }
        function toggleChangeFields() {
            const role = document.getElementById("change-role").value;
            const tg = document.getElementById("change-target-group"); const ts = document.getElementById("change-target");
            if (role === 'runner_on' || role === 'runner_off') {
                tg.style.display = "block"; ts.innerHTML = `<option value="0">一塁</option><option value="1">二塁</option><option value="2">三塁</option>`;
            } else { tg.style.display = "none"; }
        }

        function executeChange() {
            saveState(); 
            let id = appDb.currentActiveMatchId;
            let m = appDb.matches[id];
            const role = document.getElementById("change-role").value; const name = document.getElementById("change-name").value || "交代選手"; const target = parseInt(document.getElementById("change-target").value);
            
            if (role === 'pitcher') { 
                if (m.isTop) { m.hPitcherName = name; m.hPitcherPitches = 0; } else { m.vPitcherName = name; m.vPitcherPitches = 0; }
            }
            else if (role === 'batter') { 
                if (m.isTop) m.vLineup[m.vCurrentBatterIdx] = name; else m.hLineup[m.hCurrentBatterIdx] = name;
            }
            else if (role === 'runner_on') { m.bases[target] = true; } 
            else if (role === 'runner_off') { m.bases[target] = false; }
            closeChangeModal(); renderUI();
        }

        function renderUI() {
            try {
                let id = appDb.currentActiveMatchId;
                let m = appDb.matches[id];
                if (!m) return;
                
                document.getElementById("board-v-name").innerText = m.vTeam; document.getElementById("board-h-name").innerText = m.hTeam;
                document.getElementById("v-team-label").innerText = `${m.vTeam}・打線`; document.getElementById("h-team-label").innerText = `${m.hTeam}・打線`;

                document.getElementById("b-dots").innerText = "●".repeat(m.balls) + "○".repeat(3 - m.balls);
                document.getElementById("s-dots").innerText = "●".repeat(m.strikes) + "○".repeat(2 - m.strikes);
                document.getElementById("o-dots").innerText = "●".repeat(m.outs) + "○".repeat(2 - m.outs);
                
                document.getElementById("base1").className = "base b1" + (m.bases[0] ? " active-base" : "");
                document.getElementById("base2").className = "base b2" + (m.bases[1] ? " active-base" : "");
                document.getElementById("base3").className = "base b3" + (m.bases[2] ? " active-base" : "");
                document.getElementById("cell-result").innerText = m.lastEvent;

                let vTotal = 0; let hTotal = 0;
                for(let i=1; i<=9; i++) {
                    let v = m.vScore[i-1]; let h = m.hScore[i-1];
                    document.getElementById("r-v" + i).innerText = (v !== null && v !== undefined) ? v : "-";
                    document.getElementById("r-h" + i).innerText = (h !== null && h !== undefined) ? h : "-";
                    if(v !== null) vTotal += v; if(h !== null) hTotal += h;
                }
                document.getElementById("r-v-total").innerText = vTotal; document.getElementById("r-h-total").innerText = hTotal;

                if (m.isTop) {
                    document.getElementById("info-pitcher").innerText = `${m.hPitcherName} (${m.hPitcherPitches}球)`;
                } else {
                    document.getElementById("info-pitcher").innerText = `${m.vPitcherName} (${m.vPitcherPitches}球)`;
                }
                
                // ★【タイポ完全修復】：文法エラーになっていた三項演算子の構文（コロン : ）を100%完璧に修復
                let currentIdx = m.isTop ? m.vCurrentBatterIdx : m.hCurrentBatterIdx;
                let currentLineup = m.isTop ? m.vLineup : m.hLineup;
                document.getElementById("info-batter").innerText = `${currentIdx + 1}番: ${currentLineup[currentIdx] || "未登録"}`;

                let logHTML = "";
                if (m.history.length === 0) { logHTML = "この試合の打席記録はまだありません。"; } 
                else {
                    logHTML = "";
                    m.history.forEach((h) => {
                        logHTML += `<div class="log-item"><b>[${h.inning}回${h.isTop?'表':'裏'}]</b> ${h.batter} ⇒ <b>【${h.res}】</b> (${h.dir} / ${h.type} / 詳細:${h.outKind})</div>`;
                    });
                }
                document.getElementById("log-list").innerHTML = logHTML;

                let vListHtml = "";
                m.vLineup.forEach((player, idx) => {
                    let isActive = (m.isTop && idx === m.vCurrentBatterIdx) ? "current-batter-active" : "";
                    vListHtml += `<div class="player-row ${isActive}"><span>${idx+1}番: ${player}</span></div>`;
                });
                document.getElementById("v-lineup-list").innerHTML = vListHtml;

                let hListHtml = "";
                m.hLineup.forEach((player, idx) => {
                    let isActive = (!m.isTop && idx === m.hCurrentBatterIdx) ? "current-batter-active" : "";
                    hListHtml += `<div class="player-row ${isActive}"><span>${idx+1}番: ${player}</span></div>`;
                });
                document.getElementById("h-lineup-list").innerHTML = hListHtml;

                let selectorHTML = "";
                Object.keys(appDb.matches).forEach(key => {
                    let matchItem = appDb.matches[key]; let isCurrent = (key === appDb.currentActiveMatchId) ? " (表示中)" : "";
                    let statusLabel = `[${matchItem.status}] ${matchItem.vTeam} vs ${matchItem.hTeam}${isCurrent}`;
                    selectorHTML += `<option value="${key}" ${key === appDb.currentActiveMatchId ? "selected" : ""}>${statusLabel}</option>`;
                });
                document.getElementById("app-match-selector").innerHTML = selectorHTML;
            } catch(e) { console.error("画面更新エラー:", e); }
        }
    </script>
</body>
</html>
